      lower: ['L1','L2','L3','L4','L5','L6','L7','L8','L9','L10','L11','L12'],

    function App() {
      const todayIso = new Date().toISOString().split('T')[0];
      const [step, setStep] = useState('home');
      const [search, setSearch] = useState({ from: '', to: '', date: todayIso });
      const [filterType, setFilterType] = useState('All');
      const [activeBus, setActiveBus] = useState(SAMPLE_BUSES[0]);
      const [deck, setDeck] = useState('lower');
      const [selectedSeats, setSelectedSeats] = useState([]);
      const [passengers, setPassengers] = useState([]);
      const [contact, setContact] = useState({ email: '', phone: '' });
      const [formError, setFormError] = useState('');
      const [booking, setBooking] = useState(null);
      const [user, setUser] = useState(null);
      const [showAuth, setShowAuth] = useState(false);

      const buses = useMemo(() => {
        if (filterType === 'All') return SAMPLE_BUSES;
        if (filterType === 'RTC') return SAMPLE_BUSES.filter(b => b.serviceType === 'RTC');
        return SAMPLE_BUSES.filter(b => b.serviceType === 'Private');
      }, [filterType]);

      const startSeatSelection = (bus) => {
        setActiveBus(bus);
        setSelectedSeats([]);
        setStep('seats');
        window.scrollTo(0, 0);
      };

      const toggleSeat = (seatId) => {
        setSelectedSeats(prev =>
          prev.includes(seatId) ? prev.filter(s => s !== seatId) : prev.length < 6 ? [...prev, seatId] : prev
        );
      };

      const goToCheckout = () => {
        setPassengers(selectedSeats.map(s => ({ seat: s, name: '', age: '', gender: 'Male' })));
        setStep('checkout');
        window.scrollTo(0, 0);
      };

      const handleCompleteBooking = (e) => {
        e.preventDefault();
        for (const p of passengers) {
          if (!p.name.trim() || !p.age) {
            setFormError('Please enter all traveler names and ages.');
            return;
          }
        }
        if (!contact.email.includes('@') || contact.phone.length < 10) {
          setFormError('Please provide a valid email and 10-digit mobile number.');
          return;
        }
        setFormError('');
        const total = Math.round(selectedSeats.length * activeBus.price * 1.05);
        setBooking({
          pnr: 'BUS' + Math.floor(100000 + Math.random() * 900000),
          bus: activeBus,
          search,
          passengers,
          contact,
          total
        });
        setStep('confirmation');
        window.scrollTo(0, 0);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
          {/* Header */}

                <span className={step === 'checkout' ? 'text-slate-900' : ''}>3. Traveler</span> →

              </div>

            </div>

                    </div>
                    <div className="bg-white/5 border border-white/10 p-5 rounded-2xl">

                  </div>

                      <label className="text-[11px] font-black uppercase text-slate-400">Leaving From</label>

                      </select>
                    </div>
                    <div>
                      <label className="text-[11px] font-black uppercase text-slate-400">Going To</label>
                      <select value={search.to} onChange={e => setSearch({...search, to: e.target.value})} className="w-full mt-1.5 p-3 rounded-xl bg-slate-50 border border-slate-200 font-bold text-sm focus:outline-none">
                        {CITIES.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-[11px] font-black uppercase text-slate-400">Departure Date</label>
                      <input type="date" value={search.date} onChange={e => setSearch({...search, date: e.target.value})} className="w-full mt-1.5 p-2.5 rounded-xl bg-slate-50 border border-slate-200 font-bold text-sm focus:outline-none" />
                    </div>
                    <button
                      onClick={() => document.getElementById('buses-list').scrollIntoView({ behavior: 'smooth' })}
                      className="w-full py-3.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-black text-sm shadow-md shadow-red-600/20 transition-all cursor-pointer"
                    >
                      Search Live Coaches
                    </button>
                  </div>
                </div>
              </section>

              {/* Bus Results List */}
              <section id="buses-list" className="max-w-6xl mx-auto px-4 py-16 w-full">
                <div className="flex items-center justify-between mb-6">
                  <div>
                    <h2 className="text-2xl font-black text-slate-900">{search.from} → {search.to} Coaches</h2>

                <div className="space-y-4">
                  {buses.map(bus => (

                        <span className={`text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full border ${bus.serviceType === 'RTC' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-slate-100 text-slate-800 border-slate-200'}`}>

                        <h3 className="text-xl font-black text-slate-900 mt-1">{bus.name}</h3>

                        <div className="flex flex-wrap gap-1.5 mt-3">
                          {bus.amenities.map(a => <span key={a} className="text-[11px] bg-slate-100 px-2.5 py-0.5 rounded-md font-semibold text-slate-600">{a}</span>)}

                          <p className="text-xs text-slate-500 font-bold">{search.from}</p>
                        </div>
                        <div className="text-center text-xs font-bold text-slate-400">
                          {bus.duration}
                          <div className="w-16 h-0.5 bg-slate-300 my-1" />

                        <div>
                          <p className="text-xl font-black text-slate-900">{bus.arrivalTime}</p>

          {step === 'seats' && (
            <div className="max-w-6xl mx-auto px-4 py-8 w-full">
              <button onClick={() => setStep('home')} className="text-xs font-bold text-slate-600 hover:text-red-600 mb-4 cursor-pointer">← Back to Search</button>
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-7 bg-white p-6 rounded-3xl border border-slate-200">
                  <div className="flex justify-between items-center mb-6">
                    <h2 className="text-xl font-black">{activeBus.name} Berths</h2>
                    <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                      {['lower', 'upper'].map(d => (
                        <button key={d} onClick={() => setDeck(d)} className={`px-3 py-1.5 rounded-lg text-xs font-black capitalize cursor-pointer ${deck === d ? 'bg-slate-900 text-white' : 'text-slate-600'}`}>{d} Deck</button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3 max-w-sm mx-auto bg-slate-50 p-6 rounded-2xl border border-slate-200">
                    {SEATS_GRID[deck].map(seatId => {
                      const selected = selectedSeats.includes(seatId);
                      return (
                        <button
                          key={seatId}
                          onClick={() => toggleSeat(seatId)}
                          className={`h-24 rounded-2xl border-2 font-black text-sm flex flex-col items-center justify-center gap-1 transition-all ${
                            selected ? 'bg-red-600 border-red-600 text-white shadow-md' : 'bg-white border-slate-300 hover:border-red-600 text-slate-900'
                          }`}
                        >
                          <span>{seatId}</span>
                          <span className="text-[11px] font-semibold opacity-80">₹{activeBus.price}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="lg:col-span-5 bg-slate-900 text-white p-6 rounded-3xl space-y-4">
                  <h3 className="text-lg font-black">Fare Summary</h3>
                  <p className="text-xs text-slate-400">{search.from} → {search.to} • {search.date}</p>
                  <div className="pt-3 border-t border-white/10">
                    <span className="text-xs text-slate-400 font-bold">Selected Berths:</span>
                    <p className="text-base font-black text-red-500 mt-1">{selectedSeats.length ? selectedSeats.join(', ') : 'None selected'}</p>
                  </div>
                  <div className="pt-3 border-t border-white/10 flex justify-between items-baseline">
                    <span className="text-sm font-bold">Total Fare</span>
                    <span className="text-2xl font-black text-white">₹{selectedSeats.length * activeBus.price}</span>
                  </div>
                  <button
                    disabled={!selectedSeats.length}
                    onClick={goToCheckout}
                    className={`w-full py-3.5 rounded-xl font-black text-sm transition-all ${selectedSeats.length ? 'bg-red-600 hover:bg-red-700 text-white cursor-pointer shadow-lg shadow-red-600/30' : 'bg-white/10 text-slate-500 cursor-not-allowed'}`}
                  >
                    Continue to Traveler Info →
                  </button>
                </div>
              </div>
            </div>
          )}

          {step === 'checkout' && (
            <form onSubmit={handleCompleteBooking} className="max-w-4xl mx-auto px-4 py-8 w-full space-y-6">
              <button type="button" onClick={() => setStep('seats')} className="text-xs font-bold text-slate-600 hover:text-red-600 cursor-pointer">← Back to Seat Selection</button>
              <h2 className="text-2xl font-black">Traveler Information</h2>
              {formError && <div className="p-3 rounded-xl bg-red-50 border border-red-200 text-red-600 text-xs font-bold">{formError}</div>}

              <div className="bg-white p-6 rounded-3xl border border-slate-200 space-y-4">
                {passengers.map((p, idx) => (
                  <div key={p.seat} className="grid grid-cols-1 sm:grid-cols-3 gap-3 p-4 rounded-2xl bg-slate-50">
                    <input
                      type="text"
                      placeholder={`Traveler ${idx + 1} Name (Berth ${p.seat})`}
                      value={p.name}
                      onChange={e => {
                        const next = [...passengers];
                        next[idx].name = e.target.value;
                        setPassengers(next);
                      }}
                      className="p-2.5 rounded-xl border border-slate-300 bg-white text-sm font-semibold"
                    />
                    <input
                      type="number"
                      placeholder="Age"
                      value={p.age}
                      onChange={e => {
                        const next = [...passengers];
                        next[idx].age = e.target.value;
                        setPassengers(next);
                      }}
                      className="p-2.5 rounded-xl border border-slate-300 bg-white text-sm font-semibold"
                    />
                    <select
                      value={p.gender}
                      onChange={e => {
                        const next = [...passengers];
                        next[idx].gender = e.target.value;
                        setPassengers(next);
                      }}
                      className="p-2.5 rounded-xl border border-slate-300 bg-white text-sm font-semibold"
                    >
                      <option>Male</option>
                      <option>Female</option>
                    </select>
                  </div>
                ))}

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-3">
                  <input
                    type="email"
                    placeholder="Email for E-Ticket"
                    value={contact.email}
                    onChange={e => setContact({...contact, email: e.target.value})}
                    className="p-3 rounded-xl border border-slate-300 text-sm font-semibold"
                  />
                  <input
                    type="tel"
                    maxLength={10}
                    placeholder="10-Digit Mobile Number"
                    value={contact.phone}
                    onChange={e => setContact({...contact, phone: e.target.value})}
                    className="p-3 rounded-xl border border-slate-300 text-sm font-semibold"
                  />
                </div>
              </div>

              <button type="submit" className="w-full py-4 rounded-2xl bg-red-600 hover:bg-red-700 text-white font-black text-base shadow-lg shadow-red-600/25 cursor-pointer">
                Confirm & Generate Official Ticket (₹{Math.round(selectedSeats.length * activeBus.price * 1.05)})
              </button>
            </form>
          )}

          {step === 'confirmation' && booking && (
            <div className="max-w-2xl mx-auto px-4 py-10 w-full">
              <div className="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
                <div className="bg-slate-950 text-white p-6 text-center border-b border-slate-800">
                  <span className="text-xs font-bold uppercase tracking-widest text-red-500">Official Boarding Pass</span>
                  <h2 className="text-3xl font-black mt-1">PNR: {booking.pnr}</h2>
                  <p className="text-xs text-slate-400 mt-1">{booking.bus.name} • {booking.bus.type}</p>
                </div>
                <div className="p-6 space-y-4 text-sm">
                  <div className="flex justify-between font-black">
                    <span>{booking.search.from} ({booking.bus.departureTime})</span>
                    <span>→</span>
                    <span>{booking.search.to} ({booking.bus.arrivalTime})</span>
                  </div>
                  <div className="border-t border-slate-100 pt-3">
                    <span className="text-xs font-bold text-slate-400 uppercase">Passengers & Seats</span>
                    {booking.passengers.map((p, i) => (
                      <div key={i} className="flex justify-between py-1 font-semibold">
                        <span>{p.name} ({p.age}, {p.gender})</span>
                        <span className="text-red-600 font-black">Berth {p.seat}</span>
                      </div>
                    ))}
                  </div>
                  <div className="border-t border-slate-100 pt-3 flex justify-between items-baseline">
                    <span className="font-bold">Total Paid</span>
                    <span className="text-2xl font-black text-slate-900">₹{booking.total}</span>
                  </div>
                  <button onClick={() => setStep('home')} className="w-full mt-4 py-3 rounded-xl bg-slate-900 hover:bg-red-600 text-white font-bold text-xs cursor-pointer transition-colors">
                    Book Another Journey
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Auth Dialog */}
          {showAuth && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4 border border-slate-200">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-black">Sign in to Bus.com</h3>
                  <button onClick={() => setShowAuth(false)} className="text-sm font-bold px-2.5 py-1 rounded-lg bg-slate-100 cursor-pointer">✕</button>
                </div>
                <button
                  onClick={() => { setUser({ name: 'Ramesh Kumar' }); setShowAuth(false); }}
                  className="w-full py-3 rounded-xl bg-red-600 text-white font-black text-xs cursor-pointer"
                >
                  Continue as Ramesh Kumar (Instant Demo)
                </button>
              </div>
            </div>
          )}

          {/* Floating Scroll to Top */}
          <button
            onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
            title="Scroll to top"
            className="fixed bottom-6 right-6 z-40 w-12 h-12 rounded-2xl bg-slate-900 text-white flex items-center justify-center text-lg shadow-2xl border border-slate-700/60 hover:bg-red-600 hover:border-red-500 transition-all cursor-pointer"
          >
            ↑
          </button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
